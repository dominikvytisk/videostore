[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "videostore"
version = "0.1.0"
description = "Store arbitrary files inside a video that survives YouTube transcoding."
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "zstandard",
    "cryptography",
    "argon2-cffi",
    "reedsolo",
    "click",
    "blake3",
    "rich",
]

[project.optional-dependencies]
dev = ["pytest", "httpx"]
web = ["fastapi", "uvicorn[standard]", "python-multipart"]

[project.scripts]
videostore = "videostore.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]
